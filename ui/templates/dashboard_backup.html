<!DOCTYPE html>
<html>
<head>

<title>Partner AI v3.0</title>

<link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
<div class="hud">

    <div class="left-panel">

        <h2>SYSTEM</h2>
<div id="core"></div>
        <div id="clock"></div>

        <div id="date"></div>

        <div id="battery"></div>

        <div id="network"></div>

        <div id="memory"></div>

    </div>

    <div class="center-panel">

        <div id="core"></div>

        <button onclick="voiceCommand()">
            🎤 Speak

        <div id="chat"></div>

    </div>

    <div class="right-panel">

        <h2>LIVE DATA</h2>

        <div id="weather"></div>

        <div id="news"></div>

        <div id="status"></div>

    </div>

</div>
<h2>🟢 SYSTEM ONLINE</h2>

<button onclick="voiceCommand()">
🎤 Speak
</button>

<div id="chat">
    <div class="partner">
        🤖 <b>Partner:</b> Ready to assist you, sir.
    </div>
</div>
</div>

<script src="/static/js/app.js"></script>

<script src="/static/js/app.js"></script>
<script src="/static/js/ai_core.js"></script>
<script src="/static/js/widgets.js"></script>

</body>
</html>
