<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Partner AI v3.0</title>

<link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<header class="topbar">

<div class="logo">
🤖 <span>PARTNER AI</span>
</div>

<div class="topinfo">
<span id="clock">00:00</span>
<span id="battery">🔋--%</span>
</div>

</header>

<main>

<div id="core">

<div id="orb"></div>

<div class="rings">
<div class="ring ring1"></div>
<div class="ring ring2"></div>
<div class="ring ring3"></div>
</div>

</div>

<div id="status">
Ready to assist you, sir.
</div>

<button id="micButton" onclick="voiceCommand()">
🎤 Speak
</button>

<section id="chat">

<div class="partner">
🤖 <b>Partner:</b> Ready to assist you, sir.
</div>

</section>

<div class="inputBar">

<input
id="textCommand"
type="text"
placeholder="Type a command...">

<button onclick="sendText()">
Send
</button>

</div>

</main>

<script src="/static/js/app.js"></script>
<script src="/static/js/ai_core.js"></script>

</body>
</html>
